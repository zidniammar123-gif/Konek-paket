<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Pengguna</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }
        input [type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .result-container {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        .result-container h3 {
            color: #28a745;
            margin-bottom: 15px;
        }
        .random-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #28a745;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="form-section">
        <h2>Daftar Akun Baru</h2>
        <!-- Menggunakan event preventDefault di JS agar halaman tidak reload -->
        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username Anda" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email Anda" required>
            </div>
            <button type="submit">Daftarkan Sekarang</button>
        </form>
    </div>

    <!-- Area untuk menampilkan logo/gambar random setelah sukses -->
    <div id="result-section" class="result-container">
        <h3>Pendaftaran Sukses!</h3>
        <p>Selamat datang, <strong id="display-username"></strong>!</p>
        <img id="random-logo" src="" alt="Logo Acak" class="random-image">
    </div>
</div>

<script>
    document.getElementById('register-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah halaman refresh saat form dikirim

        // Ambil nilai dari input form
        const usernameInput = document.getElementById('username').value;

        // Tampilkan nama pengguna di bagian sukses
        document.getElementById('display-username').textContent = usernameInput;

        // Mengambil gambar acak menggunakan API dari Picsum Photos
        // Ditambahkan parameter timestamp (?t=...) agar gambar selalu baru setiap kali klik daftar
        const randomImageSection = document.getElementById('random-logo');
        randomImageSection.src = "https://picsum.photos" + new Date().getTime();

        // Sembunyikan form pendaftaran dan munculkan logo hasil
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komunitas Mini Online</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }
        h2, h3 {
            color: #1a1a1a;
            margin-top: 0;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; margin-top: 10px; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; margin-top: 15px; }
        .btn-danger:hover { background-color: #c82333; }

        .hidden { display: none !important; }
        
        .profile-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 10px;
        }
        .change-avatar-btn {
            font-size: 12px;
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
            display: block;
            margin-top: 5px;
        }

        .user-list {
            margin-top: 20px;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .user-item:last-child { border-bottom: none; }
        .user-avatar-sm {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid #28a745;
        }
        .user-info { flex-grow: 1; }
        .user-info .name { font-weight: bold; color: #333; }
        .user-info .email { font-size: 13px; color: #777; }
        .status-badge {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Bagian 1: Form Pendaftaran -->
    <div id="auth-section">
        <h2>Sign In / Masuk</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Buat atau masukkan username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email Anda" required>
            </div>
            <button type="submit" class="btn-primary">Masuk & Gabung Komunitas</button>
        </form>
    </div>

    <!-- Bagian 2: Dashboard -->
    <div id="dashboard-section" class="hidden">
        <h3>Profil Anda</h3>
        <div class="profile-card">
            <img id="my-avatar" src="" alt="Profil Saya" class="avatar">
            <span class="change-avatar-btn" onclick="changeAvatar()">Ganti Logo Acak Baru</span>
            
            <div class="form-group" style="text-align: left; margin-top: 15px;">
                <label>Ubah Nama:</label>
                <input type="text" id="edit-username">
            </div>
            <button onclick="updateProfile()" class="btn-success">Simpan Perubahan</button>
        </div>

        <h3>Anggota Komunitas (Online)</h3>
        <div id="community-list" class="user-list">
            <p style="text-align:center; color:#999; font-size:14px;">Menghubungkan ke database...</p>
        </div>

        <button onclick="logout()" class="btn-danger">Keluar / Sign Out</button>
    </div>

</div>

<!-- Memuat Firebase SDK Versi Modul Kompatibilitas -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
    // MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
    const firebaseConfig = {
        apiKey: "MASUKKAN_API_KEY_ANDA",
        authDomain: "MASUKKAN_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://MASUKKAN_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "MASUKKAN_PROJECT_ID",
        storageBucket: "MASUKKAN_PROJECT_ID.appspot.com",
        messagingSenderId: "MASUKKAN_SENDER_ID",
        appId: "MASUKKAN_APP_ID"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentUser = null;

    // 1. Proses Pendaftaran dan Masuk
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        // Buat ID unik berdasarkan email aman (mengganti karakter titik)
        const safeId = email.replace(/\./g, '_');

        // Cek data di database cloud
        database.ref('users/' + safeId).once('value').then((snapshot) => {
            if (snapshot.exists()) {
                currentUser = snapshot.val();
            } else {
                currentUser = {
                    id: safeId,
                    username: username,
                    email: email,
                    avatar: "https://picsum.photos/150?random=" + Math.floor(Math.random() * 1000)
                };
                // Simpan ke database cloud
                database.ref('users/' + safeId).set(currentUser);
            }
            loadDashboard();
        }).catch(err => {
            alert("Error menghubungkan ke Firebase. Periksa konfigurasi kode Anda.");
            console.error(err);
        });
    });

    function loadDashboard() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        document.getElementById('my-avatar').src = currentUser.avatar;
        document.getElementById('edit-username').value = currentUser.username;

        // Mendengarkan perubahan data secara Real-Time dari internet
        database.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            renderCommunity(data);
        });
    }

    function renderCommunity(allUsers) {
        const listContainer = document.getElementById('community-list');
        listContainer.innerHTML = '';

        if (!allUsers) return;

        let hasOtherUser = false;

        Object.keys(allUsers).forEach(key => {
            const user = allUsers[key];
            if (user.id !== currentUser.id) {
                hasOtherUser = true;
                const userCard = document.createElement('div');
                userCard.className = 'user-item';
                userCard.innerHTML = `
                    <img src="${user.avatar}" alt="${user.username}" class="user-avatar-sm">
                    <div class="user-info">
                        <div class="name">${user.username}</div>
                        <div class="email">${user.email}</div>
                    </div>
                    <span class="status-badge">Aktif</span>
                `;
                listContainer.appendChild(userCard);
            }
        });

        if (!hasOtherUser) {
            listContainer.innerHTML = '<p style="text-align:center; color:#999; font-size:14px;">Belum ada perangkat lain yang bergabung.</p>';
        }
    }

    function changeAvatar() {
        currentUser.avatar = "https://picsum.photos/150?random=" + Math.floor(Math.random() * 1000);
        document.getElementById('my-avatar').src = currentUser.avatar;
    }

    function updateProfile() {
        const newName = document.getElementById('edit-username').value.trim();
        if(!newName) return alert("Nama tidak boleh kosong!");

        currentUser.username = newName;

        // Perbarui data langsung di database cloud
        database.ref('users/' + currentUser.id).update(currentUser).then(() => {
            alert("Profil cloud berhasil disimpan!");
        });
    }

    function logout() {
        // Matikan pendengar database sebelum keluar
        database.ref('users').off();
        currentUser = null;
        document.getElementById('login-form').reset();
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
    }
</script>

</body>
</html>

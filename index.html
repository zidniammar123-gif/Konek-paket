<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Komunitas Mini</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
        }
        h2, h3 {
            color: #1a1a1a;
            margin-top: 0;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border 0.2s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary { background-color: #007bff; }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; margin-top: 10px; }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: #dc3545; margin-top: 15px; }
        .btn-danger:hover { background-color: #c82333; }

        .hidden { display: none !important; }
        
        .profile-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 10px;
        }
        .change-avatar-btn {
            font-size: 12px;
            color: #007bff;
            cursor: pointer;
            text-decoration: underline;
            display: block;
            margin-top: 5px;
        }

        .user-list {
            margin-top: 20px;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .user-item:last-child { border-bottom: none; }
        .user-avatar-sm {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid #28a745;
        }
        .user-info { flex-grow: 1; }
        .user-info .name { font-weight: bold; color: #333; }
        .user-info .email { font-size: 13px; color: #777; }
        .status-badge {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="auth-section">
        <h2>Sign In / Masuk</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Buat atau masukkan username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email Anda" required>
            </div>
            <button type="submit" class="btn-primary">Masuk & Gabung Komunitas</button>
        </form>
    </div>

    <div id="dashboard-section" class="hidden">
        
        <h3>Profil Anda</h3>
        <div class="profile-card">
            <img id="my-avatar" src="" alt="Profil Saya" class="avatar">
            <span class="change-avatar-btn" onclick="changeAvatar()">Ganti Logo Acak Baru</span>
            
            <div class="form-group" style="text-align: left; margin-top: 15px;">
                <label>Ubah Nama:</label>
                <input type="text" id="edit-username">
            </div>
            <button onclick="updateProfile()" class="btn-success">Simpan Perubahan</button>
        </div>

        <h3>Anggota yang Online</h3>
        <div id="community-list" class="user-list">
        </div>

        <button onclick="logout()" class="btn-danger">Keluar / Sign Out</button>
    </div>

</div>

<script>
    let currentUser = null;

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        
        let allUsers = JSON.parse(localStorage.getItem('communityUsers')) || [];
        
        let existingUser = allUsers.find(u => u.email === email);
        
        if (existingUser) {
            currentUser = existingUser;
        } else {
            currentUser = {
                id: 'user_' + new Date().getTime(),
                username: username,
                email: email,
                avatar: "https://picsum.photos/150?random=" + Math.floor(Math.random() * 1000)
            };
            allUsers.push(currentUser);
            localStorage.setItem('communityUsers', JSON.stringify(allUsers));
        }

        loadDashboard();
    });

    function loadDashboard() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');

        document.getElementById('my-avatar').src = currentUser.avatar;
        document.getElementById('edit-username').value = currentUser.username;

        renderCommunity();
    }

    function renderCommunity() {
        const listContainer = document.getElementById('community-list');
        listContainer.innerHTML = '';

        let allUsers = JSON.parse(localStorage.getItem('communityUsers')) || [];
        
        let otherUsers = allUsers.filter(u => u.id !== currentUser.id);

        if (otherUsers.length === 0) {
            listContainer.innerHTML = '<p style="text-align:center; color:#999; font-size:14px;">Belum ada orang lain yang mendaftar. Coba buka tab samaran/browser lain dan daftarkan akun baru!</p>';
            return;
        }

        otherUsers.forEach(user => {
            const userCard = document.createElement('div');
            userCard.className = 'user-item';
            userCard.innerHTML = `
                <img src="${user.avatar}" alt="${user.username}" class="user-avatar-sm">
                <div class="user-info">
                    <div class="name">${user.username}</div>
                    <div class="email">${user.email}</div>
                </div>
                <span class="status-badge">Aktif</span>
            `;
            listContainer.appendChild(userCard);
        });
    }

    function changeAvatar() {
        currentUser.avatar = "https://picsum.photos/150?random=" + Math.floor(Math.random() * 1000);
        document.getElementById('my-avatar').src = currentUser.avatar;
    }

    function updateProfile() {
        const newName = document.getElementById('edit-username').value.trim();
        if(!newName) return alert("Nama tidak boleh kosong!");

        currentUser.username = newName;

        let allUsers = JSON.parse(localStorage.getItem('communityUsers')) || [];
        allUsers = allUsers.map(u => u.id === currentUser.id ? currentUser : u);
        localStorage.setItem('communityUsers', JSON.stringify(allUsers));

        alert("Profil berhasil diperbarui!");
        renderCommunity();
    }

    function logout() {
        currentUser = null;
        document.getElementById('login-form').reset();
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('auth-section').classList.remove('hidden');
    }
</script>

</body>
    </html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksperimen P2P - Login Google & Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { background: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #357ae8; }
        .hidden { display: none; }
        .user-card { background: #eef2f7; padding: 10px; margin: 10px 0; border-radius: 8px; text-align: left; display: flex; align-items: center; gap: 15px; }
        .user-card img { width: 40px; height: 40px; border-radius: 50%; }
        .logout-btn { background: #dc3545; font-size: 14px; padding: 8px 15px; margin-top: 20px; }
        .logout-btn:hover { background: #c82333; }
        hr { border: 0; height: 1px; background: #ddd; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌐 P2P Share: Dashboard Publik</h2>
    
    <!-- HALAMAN BELUM LOGIN -->
    <div id="login-section">
        <p>Silakan masuk menggunakan akun Google Anda untuk mendaftarkan perangkat ke dashboard publik.</p>
        <button id="btn-login">Masuk dengan Google 🚀</button>
    </div>

    <!-- HALAMAN SETELAH LOGIN -->
    <div id="main-section" class="hidden">
        <div style="background: #e8f5e9; padding: 10px; border-radius: 8px; margin-bottom: 20px;">
            <p style="margin: 0; color: #2e7d32;"><strong>Status:</strong> Anda berhasil masuk!</p>
            <p id="user-info" style="margin: 5px 0 0 0; font-weight: bold;"></p>
        </div>
        
        <button id="btn-logout" class="logout-btn">Keluar / Logout</button>
    </div>

    <hr>

    <!-- DASHBOARD PUBLIK (BISA DILIHAT SIAPAPUN) -->
    <h3>👥 Perangkat / Email yang Aktif (Publik):</h3>
    <div id="dashboard-list">Memuat daftar perangkat...</div>
</div>

<!-- Memuat SDK Firebase secara Modular -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://gstatic.com";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://gstatic.com";

    // 1. Masukkan Konfigurasi Firebase Anda di bawah ini
    const firebaseConfig = {
        // PASTE_KONFIGURASI_FIREBASE_ANDA_DI_SINI
        // Contoh format:
        // apiKey: "AIzaSy...",
        // authDomain: "://firebaseapp.com",
        // projectId: "proyek-anda",
        // storageBucket: "://appspot.com",
        // messagingSenderId: "12345678",
        // appId: "1:1234:web:abcd"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById('login-section');
    const mainSection = document.getElementById('main-section');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const userInfo = document.getElementById('user-info');
    const dashboardList = document.getElementById('dashboard-list');

    // 2. FUNGSI LOGIN GOOGLE
    btnLogin.addEventListener('click', async () => {
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            
            // Simpan data user ke Database Firestore setelah login berhasil
            await setDoc(doc(db, "active_devices", user.uid), {
                name: user.displayName,
                email: user.email,
                photo: user.photoURL,
                lastSeen: new Date()
            });
        } catch (error) {
            console.error("Gagal Login:", error);
            alert("Gagal login menggunakan Google. Pastikan web dijalankan di server lokal (bukan file:///).");
        }
    });

    // 3. FUNGSI LOGOUT
    btnLogout.addEventListener('click', () => {
        signOut(auth);
    });

    // 4. PANTAU STATUS LOGIN USER
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginSection.classList.add('hidden');
            mainSection.classList.remove('hidden');
            userInfo.innerText = `${user.displayName} (${user.email})`;
        } else {
            loginSection.classList.remove('hidden');
            mainSection.classList.add('hidden');
        }
    });

    // 5. TAMPILKAN DASHBOARD PUBLIK SECARA REAL-TIME
    // Mengambil data dari Firestore secara otomatis setiap ada perubahan
    onSnapshot(collection(db, "active_devices"), (snapshot) => {
        dashboardList.innerHTML = "";
        if (snapshot.empty) {
            dashboardList.innerHTML = "<p style='color: #777;'>Belum ada perangkat yang aktif.</p>";
            return;
        }
        
        snapshot.forEach((doc) => {
            const data = doc.data();
            const card = document.createElement('div');
            card.className = 'user-card';
            card.innerHTML = `
                <img src="${data.photo || 'https://placeholder.com'}" alt="Foto">
                <div>
                    <strong>${data.name}</strong><br>
                    <small style="color: #555;">Email: ${data.email}</small>
                </div>
            `;
            dashboardList.appendChild(card);
        });
    });
</script>

</body>
</html>
